  <h2>Escolha os exercícios que deseja adicionar ao seu treino</h2>

  <div class="box">
    <div *ngFor="let cat of categorias" class="categoria">
      <h3>{{ cat.nome }}:</h3>

      <ul>
        <li *ngFor="let ex of cat.exercicios"
            (click)="toggleExercicio(ex)"
            [class.selecionado]="form.value.exerciciosSelecionados.includes(ex)">
          {{ ex }}
        </li>
      </ul>
    </div>
  </div>

  <button class="btn" (click)="salvar()">Salvar treino</button>
